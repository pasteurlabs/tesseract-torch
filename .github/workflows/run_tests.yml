name: Run test suite

on:
  pull_request:

  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

        # test with oldest and latest supported Python versions
        # NOTE: If bumping the minimum Python version here, also do it in
        # ruff.toml, setup.py and other CI files as well.
        python-version: ["3.12", "3.14"]

      fail-fast: false

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore UV environment
        run: cp production.uv.lock uv.lock

      - name: Install dev requirements
        run: |
          uv sync --extra dev --frozen

      - name: Run test suite
        run: |
          set -o pipefail
          uv run --no-sync pytest \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov=tesseract_torch

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: pasteurlabs/tesseract-torch
          files: coverage*.xml
          fail_ci_if_error: true

  tests-gpu:
    runs-on: tesseract-ci-gpu

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7

      - name: Show GPU info
        run: nvidia-smi

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install package
        run: |
          cp production.uv.lock uv.lock
          uv sync --python 3.12 --extra dev --frozen

      # Workaround (remove once the fix in tesseract-core is released and the
      # lock is bumped): the installed tesseract-core loads libcudart with
      # ctypes.util.find_library / bare sonames, which do not search the pip CUDA
      # wheels (nvidia-cuda-runtime, under site-packages/nvidia/*/lib). This
      # runner has no system CUDA toolkit, so the cuda_ipc decode fails to find
      # libcudart. Put the wheel lib dirs on LD_LIBRARY_PATH for every later step
      # -- including the served `tesseract-runtime serve` subprocess, which
      # inherits this environment -- so the loader resolves the bare soname.
      - name: Expose wheel CUDA runtime on LD_LIBRARY_PATH (tesseract-core workaround)
        run: |
          cuda_libs=$(uv run --no-sync python - <<'PY'
          import importlib.util
          from pathlib import Path

          dirs = []
          seen = set()

          def add(p):
              p = str(p)
              if p not in seen and Path(p).is_dir():
                  seen.add(p)
                  dirs.append(p)

          def locations(name):
              try:
                  spec = importlib.util.find_spec(name)
              except (ImportError, ValueError):
                  return ()
              return () if spec is None else (spec.submodule_search_locations or ())

          for loc in locations("nvidia"):
              for lib in Path(loc).glob("*/lib"):
                  if any(lib.glob("libcudart.so*")):
                      add(lib)

          print(":".join(dirs))
          PY
          )
          if [ -z "$cuda_libs" ]; then
            echo "No wheel CUDA runtime dirs found; nothing to add." >&2
          else
            echo "Adding to LD_LIBRARY_PATH: $cuda_libs"
            echo "LD_LIBRARY_PATH=${cuda_libs}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          fi

      - name: Show installed CUDA framework
        run: |
          uv run --no-sync python -c "import torch; print('torch', torch.__version__, 'cuda available', torch.cuda.is_available(), 'devices', torch.cuda.device_count())"

      - name: Run GPU test suite
        run: |
          set -o pipefail
          uv run --no-sync pytest \
            -v \
            -m gpu \
            --timeout=300 \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov=tesseract_torch \
            --cov-branch

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: pasteurlabs/tesseract-torch
          files: coverage*.xml
          flags: gpu
          fail_ci_if_error: true

  all-ok:
    if: always()
    needs: [tests, tests-gpu]

    runs-on: ubuntu-latest

    steps:
      - name: Check for errors
        run: |
          if [[ "${{ needs.tests.result }}" != "success" && "${{ needs.tests.result }}" != "skipped" ]]; then
            echo "Tests failed"
            exit 1
          fi

          if [[ "${{ needs.tests-gpu.result }}" != "success" && "${{ needs.tests-gpu.result }}" != "skipped" ]]; then
            echo "GPU tests failed"
            exit 1
          fi

          echo "All tests passed!"
